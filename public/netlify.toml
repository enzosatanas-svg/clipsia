# ==============================================================================
# ClipAI Generator — Netlify Deployment Configuration
# ==============================================================================

[build]
  publish = "."
  command = "# Static HTML5/CSS3/JS site - No build step required"

# Security & CORS Headers
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS, PUT, DELETE"
    Access-Control-Allow-Headers = "Content-Type, Authorization, X-Requested-With"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache policy for static assets
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Optional Backend API Proxy Rewrite
# Descomenta y ajusta si deseas canalizar las peticiones a un backend alojado en Render / Railway / Fly.io:
# [[redirects]]
#   from = "/api/*"
#   to = "https://tu-backend.onrender.com/api/:splat"
#   status = 200
#   force = true

# Single Page App routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
